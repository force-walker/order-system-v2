# Host API/Vite development; independent of backend/.env.
# Reuse the existing database; fail rather than create an empty replacement.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: order_system_v2
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d order_system_v2"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
volumes:
  pgdata:
    external: true
    name: order_system_v2_pgdata
